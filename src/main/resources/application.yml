spring:
  application:
    name: 5nel-day1-be
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sku_be}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:0000}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8080

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://*.netlify.app,http://localhost:3000,http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:likelion-hackathon-jwt-secret-key-must-be-at-least-32-bytes}
    access-token-validity: ${JWT_ACCESS_VALIDITY:3600000}
    refresh-token-validity: ${JWT_REFRESH_VALIDITY:1209600000}
  ai:
    base-url: https://generativelanguage.googleapis.com/v1
    api-key: ${OPENAI_API_KEY}
    model: gemini-3.8-flash
  storage:
    local:
      base-dir: ${APP_STORAGE_LOCAL_BASE_DIR:./uploads}
      base-url: ${APP_STORAGE_LOCAL_BASE_URL:http://localhost:8080/uploads}